<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahim Mazumder | Portfolio</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            margin-top: 20px;
        }

        .profile-img-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #333;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .verified-badge {
            width: 20px;
            height: 20px;
            fill: #1d9bf0;
            display: inline-flex;
            align-items: center;
        }

        .username {
            color: #888888;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .bio-box {
            background-color: #161616;
            border: 1px solid #262626;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 14px;
            color: #cccccc;
        }

        .fx-link {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 2px dotted #ffffff;
            padding-bottom: 1px;
            display: inline-block;
            font-weight: 600;
        }

        .fx-link:hover {
            color: #1d9bf0;
            border-bottom-color: #1d9bf0;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- প্রোফাইল পিকচার -->
        <div class="profile-img-container">
            <img src="Screenshot_20261117_191550_com.facebook.lite.jpg" alt="Fahim Mazumder" class="profile-img">
        </div>

        <!-- নাম এবং ব্লু টিক ব্যাজ -->
        <div class="name-wrapper">
            <span>Fahim Mazumder</span>
            <span class="verified-badge" title="Verified">
                <svg viewBox="0 0 24 24">
                    <path d="M9.984 20.14l-5.328-5.328 1.414-1.414 3.914 3.914 9.192-9.192 1.414 1.414-10.606 10.606z"></path>
                </svg>
            </span>
        </div>

        <!-- ইউজারনেম -->
        <p class="username">@fahimmazumders</p>

        <!-- কোম্পানি ইনফো ও ডটেড লিংক -->
        <div class="bio-box">
            Founder & CEO • <a href="https://fxgroup.bd" target="_blank" class="fx-link">FX GROUP LTD</a>
        </div>
    </div>

</body>
</html>
