*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background: linear-gradient(135deg,#0b0f1a,#162032);
    color:white;
}

/* HERO */
header{
    text-align:center;
    padding:40px 20px 10px;
}

header h1{
    font-size:20px;
    font-weight:800;
    background:linear-gradient(90deg,#00d2ff,#3a7bd5);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.username{
    margin-top:8px;
    font-size:14px;
    color:#94a3b8;
}

.username span{
    color:#00d2ff;
    font-weight:600;
}

/* IMAGE */
.container{
    padding:20px;
    max-width:900px;
    margin:auto;
}

.portfolio-img{
    width:100%;
    border-radius:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
    transition:.4s;
}

.portfolio-img:hover{
    transform:scale(1.02);
}

/* INSTAGRAM POST EMBED */
.instagram-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin: 30px auto;
    padding: 0 10px;
}

.instagram-container iframe {
    border-radius: 12px !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
    max-width: 540px !important;
    width: 100% !important;
}

/* FOOTER */
footer{
    margin-top:30px;
    padding:30px 20px;
    background:rgba(255,255,255,0.03);
    backdrop-filter: blur(12px);
    border-top:1px solid rgba(255,255,255,0.1);
    text-align:center;
}

.footer-title{
    font-size:16px;
    margin-bottom:20px;
    color:#cbd5e1;
}

/* SOCIAL ICONS */
.socials{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
}

.socials a{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#1e293b;
    transition:.3s;
}

.socials img{
    width:24px;
    filter:invert(1);
}

/* HOVER */
.socials a:hover{
    background:#3a7bd5;
    transform:translateY(-6px) scale(1.05);
    box-shadow:0 10px 25px rgba(58,123,213,0.6);
}

/* EMAIL */
.email{
    margin-top:20px;
    font-size:14px;
    color:#94a3b8;
}

/* COPYRIGHT */
.copy{
    margin-top:10px;
    font-size:12px;
    color:#64748b;
}

/* MOBILE */
@media(max-width:600px){
    header h1{
        font-size:26px;
    }
    .socials a{
        width:46px;
        height:46px;
    }
}
