<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahim Ahammad Mazumder | Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b0f1a 0%, #162032 100%);
            color: #ffffff;
            font-family: 'Nunito', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Styling */
        header {
            padding: 40px 20px 20px;
        }

        header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 16px;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Portfolio Image Grid Layout */
        .container {
            flex: 1;
            padding: 30px 20px;
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            align-items: center;
        }

        .portfolio-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .portfolio-img:hover {
            transform: translateY(-10px);
            border: 2px solid #3a7bd5;
            box-shadow: 0 15px 40px rgba(58, 123, 213, 0.4);
        }

        /* Footer Styling */
        footer {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 20px 25px;
            border-top: 1px solid #1e293b;
            margin-top: auto;
        }

        .footer-title {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Social Media Icons */
        .socials {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: #1e293b;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .socials img {
            width: 24px;
            height: 24px;
            transition: all 0.3s ease;
            filter: brightness(0) invert(1); /* Makes the icons white */
        }

        /* Hover Effects for Socials */
        .socials a:hover {
            transform: translateY(-5px);
            background: #3a7bd5;
            box-shadow: 0 8px 20px rgba(58, 123, 213, 0.5);
        }

        .socials a:hover img {
            transform: scale(1.1);
        }

        /* Contact & Copyright Info */
        .email {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .email span {
            color: #3a7bd5;
        }

        .copyright {
            font-size: 13px;
            color: #64748b;
            line-height: 1.8;
            font-weight: 400;
        }
        
        .copyright b {
            color: #cbd5e1;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }
            .socials a {
                width: 45px;
                height: 45px;
            }
            .socials img {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>
